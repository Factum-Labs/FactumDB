[package]
name = "factumdb"
version = "0.1.0"
description = "FactumDB — MySQL/InnoDB forensic examination workbench"
authors = ["Yasiru"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "factumdb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT"] }
windows-future = "0.2.1"

[features]
# This feature is used for production builds where `devUrl` points to the filesystem.
custom-protocol = ["tauri/custom-protocol"]
