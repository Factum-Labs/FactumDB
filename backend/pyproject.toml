[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factumdb-backend"
version = "0.1.0"
description = "FactumDB backend: forensic correlation engine for MySQL InnoDB evidence"

# 3.11 is the floor because it is what the team's Windows dev machines have and
# nothing in the domain needs anything newer. The Tauri sidecar ships on Ubuntu
# with a later interpreter, so the range has to cover both.
requires-python = ">=3.11"

# Dependencies are used only by the PDF adapter; core/domain remains dependency-free.
dependencies = ["fpdf2==2.8.9", "uharfbuzz==0.56.3"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pypdf>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["core", "sidecar", "adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["core"]
strict = true
